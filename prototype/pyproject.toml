[project]
name = "kijimuna-prototype"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "gpiozero>=2.0.1.post3",
    "lgpio>=0.2.2.0 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "pygame>=2.6.1",
    "smbus2>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
